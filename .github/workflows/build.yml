name: Build mod (arm64-v8a)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: false

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B out -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static

      - name: Build
        run: cmake --build out --parallel

      - name: Strip
        run: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-all out/libbetterzoom.so

      - name: Package (.levipack)
        run: |
          mkdir -p build dist
          cp out/libbetterzoom.so build/
          python3 scripts/package_levipack.py --root . --out dist/BetterZoom.levipack

      - name: Upload .levipack
        uses: actions/upload-artifact@v4
        with:
          name: BetterZoom-levipack
          path: dist/BetterZoom.levipack

      - name: Upload mod folder
        uses: actions/upload-artifact@v4
        with:
          name: BetterZoom-arm64-v8a
          path: |
            out/libbetterzoom.so
            manifest.json
